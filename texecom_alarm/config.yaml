# https://developers.home-assistant.io/docs/apps/configuration#app-configuration
name: Texecom Alarm
version: "0.3.7"
slug: texecom_alarm
description: Connect to a Texecom Premier Elite alarm panel and publish updates to MQTT
url: "https://github.com/michaelmarconi/texecom_alarm"
arch:
  - aarch64
  - amd64
# No `image:` here on purpose — this file is bind-mounted straight into the
# local dev install (local_texecom_alarm), so an `image:` key here would make
# Supervisor treat that dev copy as pull-only and block `ha apps rebuild`.
# The published `#app` branch gets `image:` injected by
# scripts/build-app-branch-tree.sh so the store install still pulls GHCR.
init: false
options:
  panel_host: ""
  panel_port: 10001
  udl_password: "1234"
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_topic_prefix: texecom
  part_arm_1: Unused
  part_arm_2: Unused
  part_arm_3: Unused
  reconnect_delay_seconds: 5
  reconciliation_poll_interval_seconds: 300
  checkin_interval_seconds: 15
  checkin_patience_seconds: 45
  log_level: INFO
schema:
  panel_host: str
  panel_port: port
  udl_password: password
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str?
  mqtt_password: password?
  mqtt_topic_prefix: str
  # Configuration radio labels (Away is full arm — not a Part-Arm choice).
  part_arm_1: list(Home 🏠|Night 🌙|Unused)
  part_arm_2: list(Home 🏠|Night 🌙|Unused)
  part_arm_3: list(Home 🏠|Night 🌙|Unused)
  # Timing bounds mirror the loader: the panel needs ~2s to free its single
  # connection slot, and hangs up on a connection it has not heard from for
  # ~60s — so the check-in cadence stays at half that tolerance or tighter.
  reconnect_delay_seconds: float(2,)
  reconciliation_poll_interval_seconds: float(0,)
  checkin_interval_seconds: float(5,30)
  checkin_patience_seconds: float(5,)
  # list(...) tokens are the Configuration radio labels (AC1).
  log_level: list(WARNING|INFO|DEBUG|TRACE)
