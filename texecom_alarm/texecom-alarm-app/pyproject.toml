[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "texecom-alarm"
version = "0.1.1"
description = "Texecom Premier Elite panel bridge for Home Assistant (MQTT discovery)"
license = { text = "MIT" }
authors = [{ name = "Michael Marconi" }]
requires-python = ">=3.12"
dependencies = [
  "aiomqtt>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff==0.8.4",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["texecom_alarm"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "S603", "S607"]
