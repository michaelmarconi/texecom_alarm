configuration:
  panel_host:
    name: Panel host
    description: Hostname or IP of the Texecom ComIP / Connect module.
  panel_port:
    name: Panel port
    description: TCP port for the panel ComIP session (default 10001).
  udl_password:
    name: UDL password
    description: >-
      Panel UDL (User Data Link) login password used by Wintex / Connect-protocol
      clients. Factory default on many Premier Elite panels is 1234 — change it
      on the panel if still set, and override here to match.
  mqtt_host:
    name: MQTT host
    description: MQTT broker hostname or IP.
  mqtt_port:
    name: MQTT port
    description: MQTT broker port (default 1883).
  mqtt_username:
    name: MQTT username
    description: Optional MQTT username (leave empty if unused).
  mqtt_password:
    name: MQTT password
    description: Optional MQTT password (leave empty if unused).
  mqtt_topic_prefix:
    name: MQTT topic prefix
    description: Root prefix for discovery and state topics (default texecom).
  part_arm_1:
    name: Part-Arm slot 1
    description: >-
      Home Assistant arm mode carried by Part-Arm slot 1 (or unused). Must match
      this installation's engineer Part-Arm layout.
  part_arm_2:
    name: Part-Arm slot 2
    description: >-
      Home Assistant arm mode carried by Part-Arm slot 2 (or unused). Must match
      this installation's engineer Part-Arm layout.
  part_arm_3:
    name: Part-Arm slot 3
    description: >-
      Home Assistant arm mode carried by Part-Arm slot 3 (or unused). Must match
      this installation's engineer Part-Arm layout.
  reconnect_normal_attempts:
    name: Reconnect attempts (normal)
    description: Named retry budget after an ordinary panel disconnect (default 4). Tunable; the add-on keeps retrying after the budget rather than exiting.
  reconnect_normal_interval_seconds:
    name: Reconnect interval seconds (normal)
    description: Wait between normal-budget reconnect attempts (default 2.5).
  reconnect_trigger_attempts:
    name: Reconnect attempts (after trigger)
    description: Named retry budget when the last alarm state was triggered (default 18). Tunable.
  reconnect_trigger_interval_seconds:
    name: Reconnect interval seconds (after trigger)
    description: Wait between trigger-budget reconnect attempts (default 5).
