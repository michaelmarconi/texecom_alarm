name: Dependabot include version bump

# require-bump on CI means Dependabot PRs cannot merge unless they raise
# SemVer. Do that on the PR branch (before main), not after merge.
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch-bump if this PR still matches main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ./scripts/sync-version.sh require-bump origin/main; then
            echo "Already bumped"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          NEXT=$(./scripts/sync-version.sh bump patch "${{ github.event.pull_request.title }}")
          git add -A
          git commit -m "chore: bump version to ${NEXT} (Dependabot)"
          git push
