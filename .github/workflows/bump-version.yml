name: Bump version

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      bump:
        description: SemVer bump kind (ignored on bootstrap when current version is untagged)
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    # Skip the bot's own bump PR merges (and any push authored as the Actions bot).
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve canonical version
        id: ver
        run: |
          if [[ -f texecom_alarm/config.yaml ]]; then
            CONFIG=texecom_alarm/config.yaml
          else
            CONFIG=config.yaml
          fi
          V=$(sed -nE 's/^version:[[:space:]]*"?([0-9]+\.[0-9]+\.[0-9]+)"?.*/\1/p' "$CONFIG" | head -1)
          echo "canonical=$V" >>"$GITHUB_OUTPUT"
          if git rev-parse "v${V}" >/dev/null 2>&1; then
            echo "tagged=yes" >>"$GITHUB_OUTPUT"
          else
            echo "tagged=no" >>"$GITHUB_OUTPUT"
          fi

      - name: Bootstrap tag current version (no bump)
        if: steps.ver.outputs.tagged == 'no'
        run: |
          V="${{ steps.ver.outputs.canonical }}"
          ./scripts/sync-version.sh check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v${V}"
          git push origin "v${V}"
          echo "Tagged v${V} (bootstrap, no bump)"

      - name: Patch bump via pull request
        if: steps.ver.outputs.tagged == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          KIND="${{ github.event.inputs.bump || 'patch' }}"
          SUBJECT=$(git log -1 --pretty=%s)
          # Skip if this push was already a version bump (defence in depth).
          if [[ "$SUBJECT" == chore:\ bump\ version\ to\ * ]]; then
            echo "Already a bump commit; nothing to do"
            exit 0
          fi
          NEXT=$(./scripts/sync-version.sh bump "$KIND" "$SUBJECT")
          if git rev-parse "v${NEXT}" >/dev/null 2>&1; then
            echo "Tag v${NEXT} already exists — refusing to reuse version" >&2
            exit 1
          fi
          BRANCH="chore/bump-${NEXT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "chore: bump version to ${NEXT}"
          git push -u origin "HEAD:${BRANCH}" --force
          # Open PR if missing; enable auto-merge so it lands after CI (branch protection).
          if ! gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr create --base main --head "$BRANCH" \
              --title "chore: bump version to ${NEXT}" \
              --body "Automated SemVer patch after merge to \`main\`. See [docs/addon-versioning.md](docs/addon-versioning.md)."
          fi
          gh pr merge "$BRANCH" --squash --auto --delete-branch || \
            gh pr merge "$BRANCH" --squash --admin --delete-branch || \
            echo "::warning::Could not auto-merge bump PR — merge chore/bump-${NEXT} when CI is green"
          # Tag after the version exists on a branch tip (tag the bump commit).
          git tag "v${NEXT}"
          git push origin "v${NEXT}"
