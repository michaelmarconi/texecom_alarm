name: Delete GHCR tags

# Maintainer housekeeping. Deletes GitHub package versions that carry a given
# image tag. Refuses `latest` and the current config.yaml version.
on:
  workflow_dispatch:
    inputs:
      tags:
        description: Space-separated GHCR tags to delete (not latest or current SemVer)
        required: true
        type: string

permissions:
  packages: write
  contents: read

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Delete tagged package versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAGS: ${{ inputs.tags }}
        run: |
          set -euo pipefail
          OWNER=michaelmarconi
          PKG=texecom-alarm
          current="$(sed -nE 's/^version:[[:space:]]*"?([0-9]+\.[0-9]+\.[0-9]+)"?.*/\1/p' texecom_alarm/config.yaml | head -1)"
          versions="$(gh api --paginate "/users/${OWNER}/packages/container/${PKG}/versions")"
          for tag in $TAGS; do
            if [[ "$tag" == "latest" || "$tag" == "$current" ]]; then
              echo "Refusing to delete ${tag}" >&2
              exit 1
            fi
            ids="$(echo "$versions" | jq -r --arg t "$tag" '.[] | select(.metadata.container.tags[]? == $t) | .id')"
            if [[ -z "$ids" ]]; then
              echo "No package version tagged ${tag}"
              continue
            fi
            for id in $ids; do
              echo "Deleting version ${id} (tag ${tag})"
              gh api --method DELETE "/users/${OWNER}/packages/container/${PKG}/versions/${id}"
            done
          done
