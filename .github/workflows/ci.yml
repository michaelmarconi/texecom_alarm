name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  texecom-alarm:
    name: Texecom Alarm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: texecom_alarm/
    steps:
      - uses: actions/checkout@v7

      - name: Version sync check
        working-directory: .
        run: ./scripts/sync-version.sh check

      - name: App branch tree check
        working-directory: .
        run: ./scripts/build-app-branch-tree.sh "${RUNNER_TEMP}/app-branch-check"

      - name: Stale DOCS.md link check
        working-directory: .
        run: ./scripts/check-docs-links.sh

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: texecom_alarm/pyproject.toml

      - name: Install package (dev extras)
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Unit + E2E tests with coverage
        run: pytest --cov=texecom_alarm --cov-report=term-missing --cov-fail-under=90

      - name: Bandit (security)
        run: bandit -r src -ll

      - name: pip-audit (dependencies)
        run: pip-audit
