name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  texecom-alarm-app:
    name: Texecom Alarm App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: texecom-alarm-app/
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: texecom-alarm-app/pyproject.toml

      - name: Install package (dev extras)
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Unit + E2E tests with coverage
        run: pytest --cov=texecom_alarm --cov-report=term-missing --cov-fail-under=90

      - name: Bandit (security)
        run: bandit -r src -ll

      - name: pip-audit (dependencies)
        run: pip-audit
